name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        actor: [google-trends-scraper]
    defaults:
      run:
        working-directory: actors/${{ matrix.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: actors/${{ matrix.actor }}/package-lock.json
      - run: npm ci
      - run: npm test
