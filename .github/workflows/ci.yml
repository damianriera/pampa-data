name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  list-actors:
    runs-on: ubuntu-latest
    outputs:
      actors: ${{ steps.list.outputs.actors }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "actors=$(ls -d actors/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: list-actors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        actor: ${{ fromJson(needs.list-actors.outputs.actors) }}
    defaults:
      run:
        working-directory: actors/${{ matrix.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: actors/${{ matrix.actor }}/package-lock.json
      - run: npm ci
      - run: npm test
